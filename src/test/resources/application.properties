# Tests stay on an in-memory database and do not touch data/upimesh.
spring.datasource.url=jdbc:h2:mem:upimesh;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
upi.mesh.packet-file=target/test-mesh/packets.ser
upi.mesh.settlement-log=target/test-ledger/settlements.log
upi.mesh.key-file=target/test-keys/server.p8
